[project]
name = "robstride-motor"
version = "0.1.0"
description = "Pure Python library for RobStride BLDC motor control via CAN"
requires-python = ">=3.11"
dependencies = [
    "python-can>=4.6.1",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
