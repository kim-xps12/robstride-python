[project]
name = "robstride-motor"
version = "0.1.0"
description = "Pure Python library for RobStride BLDC motor control via CAN"
requires-python = ">=3.11"
dependencies = [
    "gs-usb>=0.3.0",
    "matplotlib>=3.10.7",
    "python-can>=4.6.1",
    "pyusb>=1.3.1",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robstride_motor"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
